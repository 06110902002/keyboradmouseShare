# =============================================================================
# keyboradmouseShare 配置文件(key=value,'#' 起始为注释,空行忽略)
#
# 运行:  ./keyboradmouseShare [配置文件路径]
# 不带参数时默认读取当前目录下的 keyboradmouseShare.conf;文件缺失则用内置默认值。
# 改动本文件后重启程序生效,无需重新编译。
# =============================================================================

# 监听端口(需与安卓客户端 InputShare 填写的端口一致;deskflow 默认 24800)。
port = 24800

# 跨屏方式:
#   edge   = 撞屏幕边缘自动跨入安卓(默认)
#   hotkey = 仅靠热键切换
# 注:相对模式下客户端不回报光标位置,"从安卓返回主屏"始终依赖热键。
switch_mode = edge

# 触发边(仅 switch_mode=edge 时有效):left/right/top/bottom/none。
# 默认 left:安卓摆在 Mac 左侧,光标撞左边缘即跨入。
edge = left

# 切换热键(任意态都生效)。格式:修饰键用 + 连接,最后是主键。
#   修饰键:ctrl/control、shift、alt/option、cmd/command
#   主键:  字母、数字、f1..f12、space、tab、return/enter、escape
# 例:ctrl+5、control+shift+f1、cmd+space
hotkey = ctrl+5

# 是否把 Mac 的 Command 键当作 Control 发送(安卓无 Command 键,复制/粘贴用 Ctrl 更实用)。
map_command_to_control = true

# 鼠标模式:
#   relative = 发送相对增量(推荐,快甩可达屏幕任意位置、不困于矩形)
#   absolute = 发送绝对坐标(备用)
mouse_mode = relative

# 滚轮增量缩放(1.0 为原速,增大更快)。
wheel_scale = 1.0

# 安卓屏幕分辨率兜底值(握手时会被客户端上报的真实分辨率覆盖,一般无需改)。
android_width = 1200
android_height = 2670

# 是否打印 DEBUG 级日志(联调时可设 true)。
verbose = false

# 仅用于日志展示的服务端名。
server_name = mac
