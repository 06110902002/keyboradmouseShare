# =============================================================================
# keyboradmouseShare 配置文件(key=value,'#' 起始为注释,空行忽略)
#
# 运行:  ./keyboradmouseShare [配置文件路径]
# 不带参数时默认读取当前目录下的 keyboradmouseShare.conf;文件缺失则用内置默认值。
# 改动本文件后重启程序生效,无需重新编译。
# =============================================================================

# 监听端口(需与安卓客户端 InputShare 填写的端口一致;deskflow 默认 24800)。
port = 24800

# 跨屏方式:
#   edge   = 撞屏幕边缘自动跨入安卓(默认)
#   hotkey = 仅靠热键切换
# 注:两种模式下客户端都不回报光标位置,"从安卓返回主屏"由服务端的虚拟光标判定
#     (见下方 auto_return),热键切换始终可用。
switch_mode = edge

# 触发边(仅 switch_mode=edge 时有效):left/right/top/bottom/none。
# 默认 left:安卓摆在 Mac 左侧,光标撞左边缘即跨入。
edge = left

# 切换热键(任意态都生效)。格式:修饰键用 + 连接,最后是主键。
#   修饰键:ctrl/control、shift、alt/option、cmd/command
#   主键:  字母、数字、f1..f12、space、tab、return/enter、escape
# 例:ctrl+5、control+shift+f1、cmd+space
hotkey = ctrl+5

# 是否把 Mac 的 Command 键当作 Control 发送(安卓无 Command 键,复制/粘贴用 Ctrl 更实用)。
map_command_to_control = true

# 鼠标模式:
#   absolute = 发送绝对坐标 DMMV(默认,推荐)。安卓端用"数位板式绝对定位"注入,
#              光标落点就是本端发出的坐标 —— 按撞边高度比例进入精确、移动无漂移、
#              屏幕任意像素可达。要求安卓端 Injection.ABSOLUTE_POINTER_ENABLED = true。
#   relative = 发送相对增量 DMRM(备用,用于未改造的第三方 Synergy 客户端)。安卓端只能
#              相对注入,落点会被系统的指针加速增益放大,该增益不可知,故进入位置的
#              比例会有偏差。
# 注意:这是【双端成对】的开关。要回退成纯相对,两处都要改:
#       本项 relative + 安卓端 Injection.ABSOLUTE_POINTER_ENABLED = false。
#       只把本项改成 relative(安卓端仍开着绝对设备)仍然精确可用;
#       反之(本项 absolute 而安卓端关掉绝对设备)会落点错乱,不要这样配。
mouse_mode = absolute

# 是否启用"撞返回边自动切回主屏"(模仿 deskflow 绝对模式的自动切回)。
#   返回边 = 进入边(edge)的对边:edge=left(安卓在 Mac 左侧)时,
#   光标在安卓里一路向右撞到安卓右边缘即自动切回 Mac。热键切换始终有效、不受此项影响。
#   注:edge=none 时本功能自动失效(无几何布局,仅靠热键返回)。
auto_return = true

# 滚轮增量缩放(1.0 为原速,增大更快)。
wheel_scale = 1.0

# 安卓屏幕分辨率兜底值(握手时会被客户端上报的真实分辨率覆盖,一般无需改)。
android_width = 1200
android_height = 2670

# 是否打印 DEBUG 级日志(联调时可设 true)。
verbose = false

# 仅用于日志展示的服务端名。
server_name = mac
